<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬투머니 실습실 · 5장</title>
  <!-- Pyodide CDN: 브라우저 내 파이썬 환경 (file:/// 에서도 정상 동작) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #060b17;
      color: #e2e8f0;
      line-height: 1.6;
      word-break: keep-all;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 상단 제목 띠 (Header Banner) */
    .lab-top-bar {
      background: linear-gradient(90deg, #0a1329 0%, #111e3d 50%, #0a1329 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .lab-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lab-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      color: #ffd700;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .lab-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .lab-title .accent {
      color: #ffd700;
      background: linear-gradient(135deg, #fff3b0 0%, #ffd700 40%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lab-nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-link-orig {
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-link-orig:hover {
      color: #ffd700;
      border-color: rgba(212, 175, 55, 0.5);
      background: rgba(255, 255, 255, 0.04);
    }

    /* 실습실 분할 레이아웃 (Split Workspace) */
    .lab-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 24px 30px;
      max-width: 1700px;
      width: 100%;
      margin: 0 auto;
    }

    /* 공통 패널 카드 */
    .lab-panel {
      background: #0a1224;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .panel-header {
      background: #0f1c3a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .panel-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ========================================================
       왼쪽 패널: 웹앱 화면 (원데이 강좌 목록)
       ======================================================== */
    .webapp-viewport {
      background: linear-gradient(180deg, #070d1e 0%, #0c1833 40%, #0a142c 100%);
      color: #e2e8f0;
      padding: 24px;
      overflow-y: auto;
      max-height: 820px;
    }

    /* Typography & Gold Accent */
    .gold-text {
      color: #d4af37;
      background: linear-gradient(135deg, #fff3b0 0%, #ffd700 35%, #d4af37 70%, #aa7c11 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 20px rgba(212, 175, 55, 0.25);
    }

    .gold-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 9999px;
      color: #ffd700;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* 웹앱 네비게이션 헤더 */
    .webapp-nav {
      background: rgba(7, 13, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .webapp-nav-logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .webapp-nav-links {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* 강좌 목록 헤더 섹션: 제목, 체크상자, [목록 새로 고침] 버튼 */
    .course-list-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .course-list-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .course-list-title {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.6px;
      line-height: 1.2;
    }

    .course-list-subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      font-weight: 400;
    }

    /* 상단 우측 컨트롤 그룹 (체크박스 + 새로고침 버튼) */
    .course-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* "예약 가능한 강좌만 보기" 체크 상자 (직접 누를 수 없게) */
    .filter-checkbox-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(13, 24, 56, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      user-select: none;
      cursor: not-allowed;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .filter-checkbox-wrap.is-active {
      border-color: rgba(212, 175, 55, 0.55);
      background: rgba(212, 175, 55, 0.12);
      color: #ffd700;
    }

    .filter-checkbox-wrap input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ffd700;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-refresh-list {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: rgba(212, 175, 55, 0.12);
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: 10px;
      color: #ffd700;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.15);
    }

    .btn-refresh-list:hover {
      background: rgba(212, 175, 55, 0.25);
      border-color: #ffd700;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.3);
    }

    .btn-refresh-list:active {
      transform: translateY(0);
    }

    .refresh-icon {
      font-size: 1rem;
      transition: transform 0.3s ease;
    }

    .btn-refresh-list:hover .refresh-icon {
      transform: rotate(180deg);
    }

    /* 카드가 쌓이는 자리 */
    .course-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 개별 강좌 카드 */
    .course-card {
      background: linear-gradient(145deg, rgba(20, 36, 75, 0.85) 0%, rgba(10, 20, 44, 0.95) 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .course-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #ffd700, #d4af37);
      opacity: 0.8;
    }

    .course-card:hover {
      border-color: rgba(212, 175, 55, 0.65);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), 0 0 20px rgba(212, 175, 55, 0.12);
    }

    /* 마감 카드 스타일 */
    .course-card.is-closed {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.75) 0%, rgba(10, 15, 30, 0.85) 100%);
      border-color: rgba(148, 163, 184, 0.25);
      opacity: 0.85;
    }

    .course-card.is-closed::before {
      background: #64748b;
      opacity: 0.5;
    }

    /* 카드 내부 좌측 정보 묶음 */
    .course-info-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .course-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .course-name {
      font-size: 1.15rem;
      letter-spacing: -0.3px;
    }

    /* 강좌 이름 굵게 */
    .course-name strong {
      font-weight: 800;
      color: #ffffff;
      font-size: 1.2rem;
    }

    .course-card.is-closed .course-name strong {
      color: #94a3b8;
    }

    .course-details {
      font-size: 0.92rem;
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .course-details .price-val {
      color: #ffd700;
      font-weight: 700;
    }

    .course-card.is-closed .course-details .price-val {
      color: #cbd5e1;
    }

    .course-details .seat-val {
      color: #93c5fd;
      font-weight: 600;
    }

    /* 태그 뱃지 묶음 */
    .course-tag-badges {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      color: #ffd700;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    /* 상태 뱃지 그룹 */
    .course-status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 상태 뱃지 공통 */
    .badge-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* 회색 "마감" 표시 */
    .badge-closed {
      background: rgba(148, 163, 184, 0.16);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-weight: 700;
    }

    /* 빨간 글씨 "[마감 임박]" */
    .badge-urgent {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.45);
      font-weight: 800;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
    }

    /* 모집 중 뱃지 */
    .badge-open {
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-weight: 700;
    }

    /* 빈 상태 안내 */
    .empty-list-placeholder {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 40px 20px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* ========================================================
       오른쪽 패널: 파이썬 코드 에디터
       ======================================================== */
    .code-panel-body {
      padding: 16px 20px 20px;
      gap: 16px;
    }

    .code-editor-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #050a14;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      min-height: 480px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .editor-top-bar {
      background: #091224;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #64748b;
    }

    .editor-file-tab {
      color: #e2e8f0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
    }

    .editor-gutter {
      width: 44px;
      background: #040811;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 8px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #475569;
      user-select: none;
      overflow: hidden;
    }

    .code-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      padding: 14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #f8fafc;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
      tab-size: 4;
    }

    /* 하단: 상태 안내 및 버튼 그룹 */
    .code-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .code-status-area {
      flex: 1;
      min-width: 260px;
      font-size: 0.88rem;
    }

    .status-msg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      line-height: 1.4;
      font-weight: 500;
      font-size: 0.86rem;
    }

    .status-msg.loading {
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
    }

    .status-msg.success {
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .status-msg.error {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-weight: 600;
    }

    .status-msg.warning {
      color: #f97316;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      font-size: 0.84rem;
    }

    .status-msg.warning .warning-vars {
      color: #fdba74;
      font-weight: 600;
    }

    .status-msg .btn-colab-download {
      background: #f97316;
      color: #ffffff;
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      margin: 0 4px;
      display: inline-block;
    }

    .status-msg .btn-colab-download:hover {
      background: #ea580c;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 버튼 그룹 */
    .code-btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-reset {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-reset:hover {
      background: #334155;
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-colab {
      background: #0f2347;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-colab:hover {
      background: #17386d;
      border-color: #38bdf8;
      color: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-apply {
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
      color: #070d1e;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }

    .btn-apply:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffdf33 0%, #e6a817 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
    }

    .btn-apply:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.4);
      transform: none;
      box-shadow: none;
    }

    /* 좁은 화면 (휴대폰 등) 반응형 처리 */
    @media (max-width: 992px) {
      .lab-workspace {
        grid-template-columns: 1fr;
        padding: 16px 14px;
        gap: 20px;
      }

      .lab-top-bar {
        padding: 12px 16px;
      }

      .lab-title {
        font-size: 1.1rem;
      }

      .course-list-title {
        font-size: 1.7rem;
      }

      .course-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .course-status-group {
        align-self: flex-start;
      }

      .code-editor-wrapper {
        min-height: 380px;
      }

      .code-btn-group {
        flex-direction: column;
        width: 100%;
      }

      .btn-reset, .btn-colab, .btn-apply {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 맨 위 제목 띠 -->
  <header class="lab-top-bar">
    <div class="lab-title-group">
      <span class="lab-badge">LAB</span>
      <h1 class="lab-title">스킬투머니 실습실 · <span class="accent">5장</span></h1>
    </div>
    <div class="lab-nav-actions">
      <a href="/" class="btn-link-orig">원본 웹페이지 보기 ↗</a>
    </div>
  </header>

  <!-- 2. 좌우 분할 실습 공간 -->
  <main class="lab-workspace">

    <!-- [왼쪽] 웹앱 화면 -->
    <section class="lab-panel">
      <div class="panel-header">
        <h2 class="panel-title">

  <!-- 기능 스크립트: Pyodide 로드 & 정밀 진단 연동 -->
  <script>
    // 5장 처음 기본 코드 정의
    const INITIAL_CODE = `courses = [
    {"id": 1, "name": "AI 자동화", "price": 35000, "seat": 8, "booked": 8, "tags": ["초보 환영", "2시간"]},
    {"id": 2, "name": "숏폼 편집", "price": 45000, "seat": 6, "booked": 2, "tags": ["캡컷", "3시간"]},
    {"id": 3, "name": "엑셀 실무", "price": 30000, "seat": 10, "booked": 7, "tags": ["함수 실습"]},
    {"id": 4, "name": "스마트스토어", "price": 40000, "seat": 6, "booked": 5, "tags": ["상세페이지", "창업 준비"]}
]
only_open = True
for i in range(0, len(courses), 1):
    c = courses[i]
    left = c["seat"] - c["booked"]
    if only_open and left == 0:
        continue
    print(c["name"], c["price"], "원 / 남은 자리", left, "석", c["tags"])`;

    // DOM 요소 참조
    const codeEditor = document.getElementById('code-editor');
    const editorGutter = document.getElementById('editor-gutter');
    const btnReset = document.getElementById('btn-reset');
    const btnColab = document.getElementById('btn-colab');
    const btnApply = document.getElementById('btn-apply');
    const btnRefreshList = document.getElementById('btn-refresh-list');
    const courseListEl = document.getElementById('course-list');
    const codeStatusArea = document.getElementById('code-status-area');
    const chkOnlyOpen = document.getElementById('chk-only-open');
    const filterCheckboxWrap = document.getElementById('filter-checkbox-wrap');

    let pyodideInstance = null;
    let isRunning = false;
    let isInitialLoad = true;

    // 1. 에디터 줄 번호 자동 연동
    function updateLineNumbers() {
      const lines = codeEditor.value.split('\n');
      let gutterHtml = '';
      for (let i = 1; i <= Math.max(lines.length, 14); i++) {
        gutterHtml += i + '<br>';
      }
      editorGutter.innerHTML = gutterHtml;
    }
    codeEditor.addEventListener('input', updateLineNumbers);
    codeEditor.addEventListener('scroll', function() {
      editorGutter.scrollTop = codeEditor.scrollTop;
    });

    // 2. Pyodide 초기화 함수
    async function initPyodide() {
      try {
        pyodideInstance = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
        });

        // 파이썬 환경 진단 래퍼 및 환경 설정
        await pyodideInstance.runPythonAsync(`
import sys
import io
import builtins
import js
import traceback

class _UnconnectedInputError(Exception):
    def __init__(self, prompt=""):
        self.prompt = prompt
        super().__init__(prompt)

_py_stdout_buffer = io.StringIO()
sys.stdout = _py_stdout_buffer

# 5장 실습실은 input()을 쓰지 않으므로 사용 시 안내 발생
def _web_input(prompt=""):
    raise _UnconnectedInputError(str(prompt))

builtins.input = _web_input

# 사용자 전역 스코프 유지용 딕셔너리
_user_namespace = {
    '__name__': '__main__',
    '__builtins__': builtins
}

def _run_diagnostics(code_str):
    _py_stdout_buffer.seek(0)
    _py_stdout_buffer.truncate(0)

    # 1. 문법 검사 (SyntaxError, IndentationError 포착)
    try:
        compiled = compile(code_str, "<코드>", "exec")
    except (SyntaxError, IndentationError) as e:
        return {
            "status": "error",
            "error_type": e.__class__.__name__,
            "line": e.lineno,
            "message": str(e.msg if hasattr(e, 'msg') else e)
        }
    except Exception as e:
        return {
            "status": "error",
            "error_type": e.__class__.__name__,
            "line": getattr(e, 'lineno', 1),
            "message": str(e)
        }

    # 2. 실행 전 사용자 변수 스냅샷
    pre_vars = {k: repr(v) for k, v in _user_namespace.items() if not k.startswith('_')}

    # 3. 코드 실행
    try:
        exec(compiled, _user_namespace)
    except _UnconnectedInputError as e:
        return {
            "status": "unconnected_input",
            "prompt": e.prompt
        }
    except (ModuleNotFoundError, ImportError) as e:
        mod_name = getattr(e, 'name', None) or str(e)
        return {
            "status": "unconnected_module",
            "module": str(mod_name)
        }
    except Exception as exc:
        cl, e_val, tb = sys.exc_info()
        lineno = None
        for frame, line in traceback.walk_tb(tb):
            if frame.f_code.co_filename == "<코드>":
                lineno = line
        if lineno is None:
            lineno = getattr(exc, 'lineno', None)
        return {
            "status": "error",
            "error_type": exc.__class__.__name__,
            "line": lineno,
            "message": str(exc)
        }

    # 4. 성공 시 결과 및 변경된 변수 추출
    output = _py_stdout_buffer.getvalue()
    post_vars = {k: repr(v) for k, v in _user_namespace.items() if not k.startswith('_')}

    # 변경되거나 새로 생성된 변수 목록
    changed_vars = []
    for k, v in post_vars.items():
        if k not in pre_vars or pre_vars[k] != v:
            changed_vars.append(k)

    # only_open 변수 값 추출
    only_open_val = _user_namespace.get('only_open', False)

    # courses 변수에서 강좌 이름 목록 추출 시도
    courses_val = _user_namespace.get('courses', None)
    course_names = []
    if isinstance(courses_val, (list, tuple)):
        for item in courses_val:
            if isinstance(item, dict) and 'name' in item:
                course_names.append(str(item['name']))

    return {
        "status": "success",
        "output": output,
        "changed_vars": changed_vars,
        "only_open": bool(only_open_val),
        "course_names": course_names
    }
        `);

        // 초기화 완료 및 버튼 활성화
        btnApply.disabled = false;

        // 페이지를 열면 코드를 한 번 실행해 카드를 그려줌
        await runPythonCode();
        isInitialLoad = false;

      } catch (err) {
        console.error("Pyodide 로드 실패:", err);
        showStatus('error', '⚠️ 파이썬 준비 실패: 네트워크 연결을 확인해 주세요.');
      }
    }

    // 3. 오류 유형별 쉬운 한국어 안내 매핑 사전
    const ERROR_GUIDES = {
      'SyntaxError': {
        name: '구문 오류',
        desc: '문법이 맞지 않습니다. 괄호나 따옴표가 제대로 닫혔는지 확인하세요.'
      },
      'NameError': {
        name: '이름 오류',
        desc: '변수나 딕셔너리, 리스트 이름의 철자가 맞는지 확인하세요.'
      },
      'TypeError': {
        name: '자료형 오류',
        desc: '계산할 수 없는 자료형이 섞여 있거나 딕셔너리 키 또는 인덱스가 올바른지 확인하세요.'
      },
      'IndexError': {
        name: '인덱스 범위 오류',
        desc: '리스트 범위를 벗어난 번호(인덱스)를 참조하고 있지 않은지 확인하세요.'
      },
      'KeyError': {
        name: '키 오류',
        desc: '딕셔너리에 존재하지 않는 키 이름을 가져오려고 했는지 확인하세요.'
      },
      'ValueError': {
        name: '값 오류',
        desc: '올바른 형태의 값이 들어왔는지 확인하세요.'
      },
      'IndentationError': {
        name: '들여쓰기 오류',
        desc: '줄 앞의 띄어쓰기(들여쓰기) 칸 수가 맞는지 확인하세요.'
      },
      'ZeroDivisionError': {
        name: '0 나누기 오류',
        desc: '0으로 나누거나 계산하지 않았는지 확인하세요.'
      }
    };

    // 4. 상태 메시지 표시 헬퍼 함수
    function showStatus(type, contentHtml) {
      codeStatusArea.innerHTML = `<div class="status-msg ${type}">${contentHtml}</div>`;
    }

    // 주황색 안내문 (웹앱과 연결되지 않은 부분 안내) 표시
    function showWarningMessage(detailReason, changedVarNames = []) {
      const varsText = (changedVarNames && changedVarNames.length > 0)
        ? ` <span class="warning-vars">(바뀐 변수: <strong>${escapeHtml(changedVarNames.join(', '))}</strong>)</span>`
        : (detailReason ? ` <span class="warning-vars">(${escapeHtml(detailReason)})</span>` : '');

      showStatus('warning', `
        <span>코드는 바르게 실행되었지만 왼쪽 웹앱에서 달라진 것이 없습니다. 파이썬 문법이 틀린 것이 아니라, 이 실습실에서 그 부분이 웹앱과 연결되어 있지 않을 뿐입니다.</span>
        <button type="button" class="btn-colab-download" onclick="downloadCurrentCodeAsColab()">⬇ 코랩 노트북으로 받기</button>
        <span>로 코드를 받아 코랩에서 실행해 결과를 확인해 보세요.</span>
        ${varsText}
      `);
    }

    // 5. 파이썬 코드 실행 및 정밀 진단 함수
    async function runPythonCode() {
      if (!pyodideInstance || isRunning) return;

      isRunning = true;
      btnApply.disabled = true;
      showStatus('loading', '<span class="spinner"></span> 파이썬 실행 중...');

      const userCode = codeEditor.value;

      // 실행 직전 웹앱 화면 상태 스냅샷 (달라진 것 감지용)
      const prevWebappState = courseListEl.innerHTML + `::chk=${chkOnlyOpen ? chkOnlyOpen.checked : ''}`;

      try {
        // 파이썬 진단 실행기 호출
        const pyDiagnostics = pyodideInstance.globals.get('_run_diagnostics');
        const rawRes = pyDiagnostics(userCode);
        const res = rawRes.toJs({ dict_converter: Object.fromEntries });

        // A. 파이썬 코드 오류 발생 시
        if (res.status === 'error') {
          // [중요] 웹앱 화면은 그대로 둠 (아무런 변경도 하지 않음)
          const guide = ERROR_GUIDES[res.error_type] || {
            name: `${res.error_type} 오류`,
            desc: '코드 내용이나 딕셔너리, 조건문을 다시 확인해 보세요.'
          };

          const linePrefix = (res.line !== undefined && res.line !== null) ? `${res.line}번째 줄 ` : '';
          const errorMsg = `${linePrefix}${guide.name}: ${guide.desc}`;

          // 버튼 옆에 빨간 글씨로 안내
          showStatus('error', errorMsg);
          return;
        }

        // B. 이번 장에서 쓰지 않는 input()을 쓴 경우
        if (res.status === 'unconnected_input') {
          showWarningMessage('5장 실습실에서는 input() 입력 칸을 제공하지 않습니다');
          return;
        }

        // C. 이 페이지에서 쓸 수 없는 모듈을 import한 경우
        if (res.status === 'unconnected_module') {
          showWarningMessage(`이 페이지에서 사용할 수 없는 모듈: ${res.module}`);
          return;
        }

        // D. 코드가 성공적으로 실행된 경우
        if (res.status === 'success') {
          // [핵심 요구사항] 실행이 끝나면 코드의 only_open 값이 True이면 체크 상자를 체크하고, False이면 체크를 풀어 줌
          const isOnlyOpen = Boolean(res.only_open);
          if (chkOnlyOpen) {
            chkOnlyOpen.checked = isOnlyOpen;
          }
          if (filterCheckboxWrap) {
            if (isOnlyOpen) {
              filterCheckboxWrap.classList.add('is-active');
            } else {
              filterCheckboxWrap.classList.remove('is-active');
            }
          }

          // [핵심 요구사항] print() 한 줄을 강좌 카드 한 장으로 렌더링 (강좌 이름은 굵게)
          renderOutput(res.output, { courseNames: res.course_names });

          // 웹앱 화면에 실제로 달라진 점이 있는지 확인
          const currentWebappState = courseListEl.innerHTML + `::chk=${chkOnlyOpen ? chkOnlyOpen.checked : ''}`;
          const hasWebappChanged = (prevWebappState !== currentWebappState);

          // 최초 로드 시점에는 성공 메시지 기본 표시
          if (isInitialLoad) {
            showStatus('success', '✔ 파이썬 코드가 웹앱에 적용되었습니다.');
            return;
          }

          // 코드는 바르게 실행되었는데 왼쪽 웹앱에서 달라진 것이 없는 경우 (주황 글씨)
          if (!hasWebappChanged) {
            showWarningMessage(null, res.changed_vars || []);
          } else {
            // 실행에 성공하여 웹앱이 달라진 경우 (초록 글씨)
            showStatus('success', '✔ 파이썬 코드가 웹앱에 적용되었습니다.');
          }
        }

      } catch (unexpectedErr) {
        console.error("예상치 못한 실행 에러:", unexpectedErr);
        showStatus('error', `오류 발생: ${escapeHtml(unexpectedErr.message || String(unexpectedErr))}`);
      } finally {
        isRunning = false;
        btnApply.disabled = false;
      }
    }

    // 6. print( ) 한 줄을 강좌 카드 한 장으로 보여주는 렌더러
    // - print() 한 줄을 강좌 카드 한 장으로 보여 줌
    // - 줄의 맨 앞 강좌 이름은 굵게 보여 줌
    // - 가격, 남은 좌석, 태그 목록을 카드 내부에 조화롭게 배치
    function renderOutput(outputText, context = {}) {
      courseListEl.innerHTML = '';

      if (!outputText || !outputText.trim()) {
        courseListEl.innerHTML = `
          <div class="empty-list-placeholder">
            <span>출력된 내용이 없습니다. print() 문으로 강좌 정보를 출력해 보세요.</span>
          </div>
        `;
        return;
      }

      const lines = outputText.trim().split('\n');
      const knownCourseNames = (context && Array.isArray(context.courseNames) && context.courseNames.length > 0)
        ? context.courseNames
        : ["AI 자동화", "숏폼 편집", "엑셀 실무", "스마트스토어"];

      lines.forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line) return;

        // 1. 강좌 이름 추출 (맨 앞 부분)
        let courseName = '';
        let restText = '';

        // 알려진 강좌명과 일치하는 접두사 탐색
        for (const name of knownCourseNames) {
          if (line.startsWith(name)) {
            courseName = name;
            restText = line.slice(name.length).trim();
            break;
          }
        }

        // 접두사 매칭이 안 된 경우: 숫자 가격 이전 또는 첫 단어를 강좌 이름으로 분리
        if (!courseName) {
          const matchPrice = line.match(/^(.+?)\s+(\d[\d,]*\s*원.*)$/);
          if (matchPrice) {
            courseName = matchPrice[1].trim();
            restText = matchPrice[2].trim();
          } else {
            const firstWordMatch = line.match(/^(\S+)\s*(.*)$/);
            if (firstWordMatch) {
              courseName = firstWordMatch[1];
              restText = firstWordMatch[2];
            } else {
              courseName = line;
              restText = '';
            }
          }
        }

        // 2. 태그 리스트 추출 (맨 뒤 ['태그1', '태그2'] 형태 탐색)
        let tags = [];
        let detailsWithoutTags = restText;
        const tagMatch = restText.match(/\[(.*?)\]\s*$/);
        if (tagMatch) {
          detailsWithoutTags = restText.slice(0, tagMatch.index).trim();
          const rawTagsContent = tagMatch[1];
          // 따옴표로 감싸진 태그 요소 추출
          const tagItems = rawTagsContent.match(/'([^']+)'|"([^"]+)"/g);
          if (tagItems) {
            tags = tagItems.map(t => t.replace(/['"]/g, '').trim()).filter(Boolean);
          } else if (rawTagsContent.trim()) {
            tags = rawTagsContent.split(',').map(t => t.trim().replace(/['"]/g, '')).filter(Boolean);
          }
        }

        // 3. 잔여석 감지 및 상태 뱃지 생성
        let isClosed = false;
        let isUrgent = false;
        let statusBadgeHtml = '';

        // "남은 자리 0 석" 또는 "0 석"
        const seatZeroMatch = detailsWithoutTags.match(/남은\s*자리\s*0\s*석/i) || detailsWithoutTags.match(/\b0\s*석\b/i);
        const seatUrgentMatch = detailsWithoutTags.match(/남은\s*자리\s*([12])\s*석/i) || detailsWithoutTags.match(/\b([12])\s*석\b/i);

        if (seatZeroMatch || detailsWithoutTags.includes('[마감]')) {
          isClosed = true;
          statusBadgeHtml = `<span class="badge-status badge-closed">마감</span>`;
        } else if (seatUrgentMatch || detailsWithoutTags.includes('[마감 임박]')) {
          isUrgent = true;
          statusBadgeHtml = `<span class="badge-status badge-urgent">🔥 마감 임박</span>`;
        } else {
          statusBadgeHtml = `<span class="badge-status badge-open">모집 중</span>`;
        }

        // 4. 상세 텍스트 포맷팅 (가격 골드 강조, 슬래시 정리)
        let formattedDetails = escapeHtml(detailsWithoutTags)
          .replace(/\[마감 임박\]/g, '')
          .replace(/\[마감\]/g, '')
          .trim();

        // 가격 강조: "45000 원" -> "<span class="price-val">45,000원</span>"
        formattedDetails = formattedDetails.replace(/(\d[\d,]*)\s*원/g, function(match, numStr) {
          const rawNum = numStr.replace(/,/g, '');
          const num = Number(rawNum);
          const displayStr = !isNaN(num) ? num.toLocaleString() : numStr;
          return `<span class="price-val">${displayStr}원</span>`;
        });

        // 남은 자리 강조
        formattedDetails = formattedDetails.replace(/남은\s*자리\s*(\d+)\s*석/g, function(match, seatCount) {
          return `<span class="seat-val">남은 자리 ${seatCount}석</span>`;
        });

        // 태그 뱃지 HTML 생성
        let tagsHtml = '';
        if (tags && tags.length > 0) {
          tagsHtml = `
            <div class="course-tag-badges">
              ${tags.map(t => `<span class="tag-badge">#${escapeHtml(t)}</span>`).join('')}
            </div>
          `;
        }

        // 5. 카드 DOM 엘리먼트 생성
        const cardEl = document.createElement('div');
        cardEl.className = `course-card ${isClosed ? 'is-closed' : ''}`;

        cardEl.innerHTML = `
          <div class="course-info-group">
            <div class="course-name-row">
              <span class="course-name">
                <strong>${escapeHtml(courseName)}</strong>
              </span>
            </div>
            ${formattedDetails ? `<div class="course-details">${formattedDetails}</div>` : ''}
            ${tagsHtml}
          </div>
          <div class="course-status-group">
            ${statusBadgeHtml}
          </div>
        `;

        courseListEl.appendChild(cardEl);
      });
    }

    // 7. [⬇ 코랩 노트북(.ipynb)으로 받기] 다운로드 기능
    // - 파일명: ch05_lab.ipynb
    // - 셀 1: 설명(마크다운) "5장 실습실에서 고친 코드입니다. 셀을 실행하면 강좌 목록과 잔여석 상태를 확인할 수 있습니다."
    // - 셀 2: 코드 (현재 코드 칸의 내용)
    // - 완료 후: "✔ ch05_lab.ipynb를 내려받았습니다. 코랩 [파일] → [노트북 업로드]로 여세요." 표시
    window.downloadCurrentCodeAsColab = function() {
      const currentCode = codeEditor.value;
      const notebookObj = {
        nbformat: 4,
        nbformat_minor: 2,
        metadata: {
          colab: {
            name: "ch05_lab.ipynb",
            provenance: []
          },
          kernelspec: {
            name: "python3",
            display_name: "Python 3"
          },
          language_info: {
            name: "python"
          }
        },
        cells: [
          {
            cell_type: "markdown",
            metadata: {},
            source: [
              "5장 실습실에서 고친 코드입니다. 셀을 실행하면 강좌 목록과 잔여석 상태를 확인할 수 있습니다."
            ]
          },
          {
            cell_type: "code",
            execution_count: null,
            metadata: {},
            outputs: [],
            source: currentCode.split('\n').map((line, idx, arr) => idx < arr.length - 1 ? line + '\n' : line)
          }
        ]
      };

      const blob = new Blob([JSON.stringify(notebookObj, null, 2)], { type: "application/x-ipynb+json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "ch05_lab.ipynb";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      // 내려받은 뒤 초록색 안내 표시
      showStatus('success', '✔ ch05_lab.ipynb를 내려받았습니다. 코랩 [파일] → [노트북 업로드]로 여세요.');
    };

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 8. 이벤트 바인딩
    // [처음 코드로] 버튼 클릭 시
    btnReset.addEventListener('click', function() {
      codeEditor.value = INITIAL_CODE;
      updateLineNumbers();
      runPythonCode();
    });

    // [⬇ 코랩 노트북(.ipynb)으로 받기] 버튼 클릭 시
    btnColab.addEventListener('click', downloadCurrentCodeAsColab);

    // [▶ 웹앱에 적용하기] 버튼 클릭 시
    btnApply.addEventListener('click', runPythonCode);

    // [목록 새로 고침] 버튼 클릭 시 파이썬 코드 재실행
    if (btnRefreshList) {
      btnRefreshList.addEventListener('click', function() {
        runPythonCode();
      });
    }

    // 9. 페이지 로드 시 Pyodide 환경 시작
    window.addEventListener('DOMContentLoaded', () => {
      updateLineNumbers();
      initPyodide();
    });
  </script>
